<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="left">
        <div id="odin-logo">
            <div>
                <img src="./odin-lined.png" alt="odin-logo">
            </div>
            <div>
                <h1>ODIN</h1>
            </div>
        </div>
    </div>
    <div class="right">
        <p>Esta es una prueba en la que pongo en práctica lo aprendido en el módulo de formularios de The Odin Project</p>
        <h2 id="legend-form">Let's do it!</h2>

        <form action="" method="post">
            
            <div class="campo-form">
                <label for="name">Nombre</label>
                <input class="input" type="text" name="first-name" id="name" minlength="4" required>
            </div>
            <div class="campo-form">
                <label for="surname">Apellido</label>
                <input class="input" type="text" name="surname" id="surname" minlength="4" required>
            </div>

            <div class="campo-form">
                <label for="mail">Correo electrónico</label>
                <input  class="input" type="email" name="mail" id="mail" required>
            </div>

            <div class="campo-form">
                <label for="phone-number">Número de télefono</label>
                <input class="input" type="tel"  name="phone-number" minlength="10" id="phone-number" required>
            </div>
            <div class="campo-form">
                <label for="password">Contraseña</label>
                <input class="input" type="password" name="password" minlength="10" id="password" required>
            </div>
            <div class="campo-form">
                <label for="confirm-password">Confirmar contraseña</label>
                <input class="input" type="password" name="confirm-password" minlength="10" id="confirm-password" required>
            </div>

            <button type="submit">Create account</button>
            



        </form>
        <span>Todavía no tienes una cuenta?</span>
        <a href="">Login</a>

    </div>

    <script src="app.js"></script>
</body>
</html>
