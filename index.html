<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="left">
        <div id="odin-logo">
            <div>
                <img src="./odin-lined.png" alt="odin-logo">
            </div>
            <div>
                <h1>ODIN</h1>
            </div>
        </div>
    </div>
    <div class="right">
        <p>Esta es una prueba en la que pongo en práctica lo aprendido en el módulo de formularios de The Odin Project</p>
    
        <form action="" method="post">
            <legend>Let's do it!</legend>

            <div class="campo-form">
                <label for="name">Nombre</label>
                <input type="text" name="first-name" id="name" required>
            </div>
            <div class="campo-form">
                <label for="surname">Apellido</label>
                <input type="text" name="surname" id="surname" required>
            </div>

            <div>
                <label for="mail">Correo electrónico</label>
                <input type="mail" name="mail" id="mail" required>
            </div>

            <div>
                <label for="phone-number">Número de télefono</label>
                <input type="number" name="phone-number" id="phone-number">
            </div>
            <div>
                <label for="password">Contraseña</label>
                <input type="password" name="password" id="password">
            </div>
            <div>
                <label for="confirm-password">Confirmar contraseña</label>
                <input type="password" name="confirm-password" id="confirm-password">
            </div>



        </form>


    </div>







    <script src="app.js"></script>
</body>
</html>
